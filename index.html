<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Staff Face Attendance</title>
    <!-- face-api.js লাইব্রেরি লোড করা হচ্ছে -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 500px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #status { font-size: 20px; font-weight: bold; margin-top: 15px; color: #333; }
    </style>
</head>
<body>

    <h2>স্টাফ হাজিরা সিস্টেম (ফেস স্ক্যানার)</h2>
    <video id="video" autoplay muted playsinline></video>
    <div id="status">ক্যামেরা লোড হচ্ছে... অনুগ্রহ করে সামনে দাঁড়ান।</div>

    <script>
        constvideo = document.getElementById('video');
        conststatusText = document.getElementById('status');
        constWEB_APP_URL = "https://script.google.com/macros/s/AKfycbweaQQM_3t7uSezBHlLIOt5N5R7VbFyyZs33wbnD3Vv_IdPoKjRN_h5r4qpJFSmwZIX/exec"
        asyncfunction startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => { video.srcObject = stream; })
                .catch(err => {
                    console.error("ক্যামেরা পাওয়া যায়নি: ", err);
                    statusText.innerText = "ক্যামেরা চালু করা সম্ভব হয়নি। ব্রাউজার পারমিশন চেক করুন।";
                });
        }

        asyncfunction loadModels() {
            statusText.innerText = "AI মডেল লোড হচ্ছে...";
            try {
                awaitfaceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
                awaitfaceapi.nets.faceLandmarkNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
                awaitfaceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
                statusText.innerText = "সিস্টেম প্রস্তুত! ক্যামেরার সামনে আসুন।";
                detectFaces();
            } catch (error) {
                statusText.innerText = "মডেল লোড হতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন।";
            }
        }

        functiondetectFaces() {
            setInterval(async () => {
                constdetections = awaitfaceapi.detectSingleFace(video, newfaceapi.TinyFaceDetectorOptions());
                if (detections) {
                    statusText.innerText = "মুখ শনাক্ত করা হয়েছে! হাজিরা রেকর্ড হচ্ছে...";
                    recordAttendance("STF-101", "Rahul Kumar");
                }
            }, 5000);
        }

        functionrecordAttendance(id, name) {
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ staff_id: id, staff_name: name, status: "Present" })
            }).then(() => {
                statusText.innerText = ধন্যবাদ, ${name}! হাজিরা সফল হয়েছে।;
            });
        }

        startVideo();
        video.addEventListener('play', () => {
            loadModels();
        });
    </script>
</body>
</html>
